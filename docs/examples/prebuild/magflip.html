<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Magzog</title>
      <script src="https://cdn.jsdelivr.net/npm/@magflip/minjs@0.6.0/magflip.min.js"></script>
      <!-- Use for local test -->
      <!-- <script src="../../../packages/minjs/magflip.min.js"></script>  -->
    <script>
    var shelfManager;
    var bookViewer;
    var shelf;
    document.addEventListener('DOMContentLoaded', function () {
      // The manager opens books in the viewer; the flip view turns their pages.
      shelfManager = new BookShelfManager();
      bookViewer = shelfManager.getBookViewer();
      const view = new FlipView();
      bookViewer.registerView(view);
      bookViewer.setCurView(view.id);

      // The shelf lays the books out. Pressing one flies it to the viewer.
      shelf = new BookShelf({ manager: shelfManager, layout: ShelfLayout.Shelf });
      shelf.addBook(getSampleBook(1, 6));
      shelf.addBook(getSampleBook(2, 10));
      shelf.addBook(getSampleBook(3, 16));

      // Optional
      window.shelfManager = shelfManager;
      window.bookViewer = bookViewer;
      window.shelf = shelf;
      addZoomRange(bookViewer);
    });

    function addZoomRange(bookViewer){
      const viewerEl = bookViewer.element;
      const input = document.createElement('input');
      input.type = 'range';
      input.id = 'zoomRange';
      input.min = '0.5';
      input.max = '2';
      input.value = '1';
      input.step = '0.01';
      viewerEl.appendChild(input);
      input.addEventListener('input', (event) => {
        bookViewer.setZoomLevel(Number(input.value));
      });
    }

    /** A book of `pageCnt` pictures from resources/book{bookNum}/, its first page as the cover. */
    function getSampleBook(bookNum, pageCnt){
      const pages = [];
      for(let i=0;i<pageCnt;i++){
        pages.push({
          id: "page"+i,
          index: i,
          image: `./resources/book${bookNum}/page${i}.jpg`
        })
      }
      const book = new Book({
        id: 'mybook' + bookNum,
        lastPageIndex: pageCnt-1,
        thumbnails: {
          spine: pages[0].image,
          small: pages[0].image,
          medium: pages[0].image,
          cover: {
            front: pages[0].image,
            back: pages[0].image,
          }
        }
      })
      book.importPages(pages, { width: 700, height: 700 });
      return book;
    }
  </script>

  <style>
    #zoomRange {
      position: absolute;
      top: 10px;
      right: 100px;
    }
  </style>
</head>

<body>
</body>
</html>
